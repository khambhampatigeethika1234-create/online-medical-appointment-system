<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Online Payment</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f9ff;
    margin:0;
}

header{
    background:#1976D2;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:400px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px lightgray;
}

h2{
    text-align:center;
    color:#1976D2;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

</style>

</head>

<body>

<header>
<h1>Online Medical Appointment System</h1>
</header>

<div class="container">

<h2> Online Payment</h2>

<h3 style="text-align:center;color:#28a745;">
Consultation Fee: ₹500
</h3>

<input type="text" placeholder="Card Holder Name">

<input type="text" placeholder="Card Number">

<input type="text" placeholder="Expiry Date (MM/YY)">

<input type="password" placeholder="CVV">

<h3 style="text-align:center;color:#1976D2;">
Choose Payment Method
</h3>

<input type="radio" name="payment" checked>
 Card Payment

<br><br>

<input type="radio" name="payment">
 UPI Payment (PhonePe / Google Pay / Paytm)

<br><br>

<div style="text-align:center;">

<h3>Scan QR Code</h3>

<img src="images/qr.png" width="200" height="200" alt="UPI QR Code">

<p>PhonePe | Google Pay | Paytm</p>

</div>

<button onclick="paymentSuccess()">
Pay ₹500
</button>

</div>

<script>

function paymentSuccess(){

alert("✅ Payment Successful!");

window.location.href =
"receipt.php?patient_name=" + encodeURIComponent(localStorage.getItem("patient_name")) +
"&doctor=" + encodeURIComponent(localStorage.getItem("doctor")) +
"&appointment_date=" + encodeURIComponent(localStorage.getItem("appointment_date")) +
"&appointment_time=" + encodeURIComponent(localStorage.getItem("appointment_time"));

}
</script>

</body>
</html>
