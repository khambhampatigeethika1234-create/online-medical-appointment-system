<body>


<header>

<h1>Online Medical Appointment System</h1>

<p>Your Health, Our Priority</p>

</header>


<nav>

<a href="index.html">Home</a>

<a href="about.html">About</a>

</nav>


<div class="container">

<h2>Book Appointment</h2>


<form action="appointment.php" method="POST">


<label>Patient Name</label>

<input
type="text"
name="name"
placeholder="Enter your name"
required
>


<label>Email</label>

<input
type="email"
name="email"
placeholder="Enter your email"
required
>


<label>Phone Number</label>

<input
type="text"
name="phone"
placeholder="Enter phone number"
required
>


<label>Select Doctor</label>

<select name="doctor" id="doctor" required>

<option value="">Select Doctor</option>

<option value="Dr. Rajesh Kumar - Cardiologist">
Dr. Rajesh Kumar - Cardiologist
</option>

<option value="Dr. Priya Sharma - Gynecologist">
Dr. Priya Sharma - Gynecologist
</option>

<option value="Dr. Arun Kumar - General Physician">
Dr. Arun Kumar - General Physician
</option>

<option value="Dr. Sneha Reddy - Dermatologist">
Dr. Sneha Reddy - Dermatologist
</option>

</select>


<label>Appointment Date</label>

<input type="date" name="date" required>

<label>Appointment Time:</label>
<select name="time" required>
    <option value="">Select Time</option>
    <option value="09:00 AM">09:00 AM</option>
    <option value="10:00 AM">10:00 AM</option>
    <option value="11:00 AM">11:00 AM</option>
    <option value="12:00 PM">12:00 PM</option>
    <option value="01:00 PM">01:00 PM</option>
    <option value="02:00 PM">02:00 PM</option>
    <option value="03:00 PM">03:00 PM</option>
    <option value="04:00 PM">04:00 PM</option>
    <option value="05:00 PM">05:00 PM</option>
    <option value="06:00 PM">06:00 PM</option>
</select>

<label>Message</label>

<textarea name="message"></textarea>

<button type="submit" name="book">

Book Appointment

</button>


</form>

</div>


<footer>

&copy; 2026 Online Medical Appointment System | All Rights Reserved

</footer>

<script>

window.onload = function() {

    const doctorSelect = document.getElementById("doctor");
    const params = new URLSearchParams(window.location.search);
    const doctor = params.get("doctor");

    if (doctor) {

        if (doctor.includes("Rajesh")) {
            doctorSelect.value = "Dr. Rajesh Kumar - Cardiologist";
        }

        else if (doctor.includes("Priya")) {
            doctorSelect.value = "Dr. Priya Sharma - Gynecologist";
        }

        else if (doctor.includes("Arun")) {
            doctorSelect.value = "Dr. Arun Kumar - General Physician";
        }

        else if (doctor.includes("Sneha")) {
            doctorSelect.value = "Dr. Sneha Reddy - Dermatologist";
        }

    }

};

</script>
