<div class="container">

<h2>Book Video Appointment</h2>


<form action="video_appointment.php" method="POST">


<label>Patient Name</label>

<input
type="text"
name="name"
placeholder="Enter your name"
required
>


<label>Email</label>

<input
type="email"
name="email"
placeholder="Enter your email"
required
>


<label>Phone Number</label>

<input
type="text"
name="phone"
placeholder="Enter phone number"
required
>


<label>Select Doctor</label>

<select name="doctor" required>

<option value="">Select Doctor</option>

<option value="Dr. Rajesh Kumar">
Dr. Rajesh Kumar - Cardiologist
</option>

<option value="Dr. Priya Sharma">
Dr. Priya Sharma - Gynecologist
</option>

<option value="Dr. Arun Kumar">
Dr. Arun Kumar - General Physician
</option>

<option value="Dr. Sneha Reddy">
Dr. Sneha Reddy - Dermatologist
</option>

</select>


<label>Appointment Date</label>

<input
type="date"
name="date"
required
>


<label>Appointment Time</label>

<select name="time" required>

<option value="">Select Time</option>

<option value="10:00 AM">10:00 AM</option>

<option value="11:00 AM">11:00 AM</option>

<option value="12:00 PM">12:00 PM</option>

<option value="2:00 PM">2:00 PM</option>

<option value="4:00 PM">4:00 PM</option>

<option value="6:00 PM">6:00 PM</option>

</select>


<label>Message</label>

<textarea
name="message"
placeholder="Enter your health concern or message"
></textarea>


<button type="submit" name="video_book">

Proceed to Payment
</button>


</form>
